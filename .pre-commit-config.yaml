minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        args:
          - "--style={BasedOnStyle: Google, IndentWidth: 4, ColumnLimit: 120, BreakBeforeBraces: Allman}"
          - "--verbose"
          - "-i"
        exclude: ^build/|tests/third_party/

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix"]
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h",
          ]

  # typos 检查
  - repo: https://gitcode.com/gh_mirrors/ty/typos
    rev: v1.32.0
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: local
    hooks:
      - id: qr-ulp-host-tests
        name: QR ULP hard limit Host tests
        # 仅执行 QR-ULP 用例（两个 qr_ulp 测试只消费 cgeqrf verify 脚本），
        # files 与 entry 匹配收窄；全量判定门禁由 nonfinite-verdict-tests 承担
        entry: python -m pytest -q tests/host/test_nonfinite_accuracy_verdict.py -k qr_ulp
        language: python
        additional_dependencies: [numpy, scipy, pytest]
        pass_filenames: false
        files: ^test/cgeqrf/data/verify_result\.py$
      - id: nonfinite-verdict-tests
        name: Nonfinite accuracy verdict Host tests
        entry: python -m pytest -q tests/host/test_nonfinite_accuracy_verdict.py
        language: python
        additional_dependencies: [numpy, scipy, pytest]
        pass_filenames: false
        files: ^test/(cgeqrf|sgetrf|cgetrf|sgetri|cgetri_batched|cmatinv_batched|sgetrs|cgetrs|cpotrf)/data/verify_result\.py$|^tests/host/test_nonfinite_accuracy_verdict\.py$
      - id: cheevj-host-block-tests
        name: Cheevj Host numeric block tests
        entry: python -m pytest -q tests/host/test_cheevj_2x2_vector_host.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^src/cheevj/cheevj_host\.cpp$|^tests/host/test_cheevj_2x2_vector_host\.py$
      - id: cheevj-basis-verdict-tests
        name: Cheevj basis verdict Host tests
        entry: python -m pytest -q tests/host/test_cheevj_basis_verdict.py
        language: python
        additional_dependencies: [numpy, pytest]
        pass_filenames: false
        files: ^test/cheevj/data/verify_result\.py$|^tests/host/test_cheevj_basis_verdict\.py$
      - id: complex-qr-require-tests
        name: Complex QR shared require() diagnostics tests
        entry: python -m pytest -q tests/host/test_require_diagnostic_location.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^test/common/complex_qr/.*\.py$|^tests/host/test_require_diagnostic_location\.py$
      - id: install-deps-cmake-repository-tests
        name: install_deps.sh CMake repository setup tests
        entry: python -m pytest -q tests/host/test_cmake_repository_setup.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^install_deps\.sh$|^tests/host/test_cmake_repository_setup\.py$
      - id: uninstall-deletion-tests
        name: install.sh uninstall deletion Host tests
        entry: python -m pytest -q tests/host/test_uninstall_deletion_status.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^scripts/package/install\.sh$|^tests/host/test_uninstall_deletion_status\.py$
      - id: build-driver-contract-tests
        name: build.sh driver contract Host tests
        entry: python -m pytest -q tests/host/test_build_path_arguments.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^build\.sh$|^tests/host/test_build_path_arguments\.py$
      - id: cholesky-fixtures-compat-tests
        name: Cholesky fixtures Python compatibility tests
        entry: python -m pytest -q test/utils/cholesky/test_python_compat.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^test/utils/cholesky/(fixtures|lapack_residual)\.py$|^test/utils/cholesky/test_python_compat\.py$|^test/cholesky/data/verify_result\.py$
      - id: cholesky-lapack-residual-tests
        name: Cholesky LAPACK residual Host tests
        entry: python -m pytest -q test/cholesky/test_lapack_residual.py
        language: python
        additional_dependencies: [numpy, scipy, pytest]
        pass_filenames: false
        files: ^test/cholesky/(lapack_residual|conftest)\.py$|^test/cholesky/test_lapack_residual\.py$
      - id: cholesky-data-verifier-tests
        name: Cholesky data verifier behavior Host tests
        entry: python -m pytest -q test/cholesky/test_data_verify.py
        language: python
        additional_dependencies: [numpy, scipy, pytest]
        pass_filenames: false
        files: ^test/cholesky/data/verify_result\.py$|^test/cholesky/test_data_verify\.py$
      - id: cpack-run-registration-tests
        name: CPack run registration Host tests
        # 下载到临时文件先做 SHA256 校验（对齐 cmake/third_party/makeself-fetch.cmake
        # 的 URL_HASH），再解压；curl/tar 退出码逐一显式检查，失败报明确错误并清理
        # 半成品缓存；幂等判断同时检查 makeself.sh 与 makeself-header.sh（对齐
        # makeself-fetch.cmake:19），不齐则整体重新下载，避免部分解压永久毒化共享缓存
        entry: bash -c 'd="${SOLVER_MAKESELF_CACHE:-/tmp/ops-solver-makeself}"; u="https://gitcode.com/cann-src-third-party/makeself/releases/download/release-2.5.0-patch1.0/makeself-release-2.5.0-patch1.tar.gz"; h="bfa730a5763cdb267904a130e02b2e48e464986909c0733ff1c96495f620369a"; if [ ! -f "$d/makeself.sh" ] || [ ! -f "$d/makeself-header.sh" ]; then rm -rf "$d"; mkdir -p "$d"; t="$(mktemp -d)" || exit 1; curl -fsSL "$u" -o "$t/makeself.tar.gz" || { echo "ERROR makeself download failed, cannot run cpack registration tests" >&2; rm -rf "$t" "$d"; exit 1; }; echo "$h  $t/makeself.tar.gz" | sha256sum -c - > /dev/null || { echo "ERROR makeself archive sha256 mismatch, refusing to extract" >&2; rm -rf "$t" "$d"; exit 1; }; tar xzf "$t/makeself.tar.gz" -C "$d" --strip-components=1 || { echo "ERROR makeself extract failed" >&2; rm -rf "$t" "$d"; exit 1; }; rm -rf "$t"; fi; SOLVER_MAKESELF_PATH="$d" python -m pytest -q tests/host/test_cpack_run_registration.py'
        language: python
        additional_dependencies: [cmake, pytest]
        pass_filenames: false
        files: ^cmake/(makeself|package)\.cmake$|^scripts/package/install\.sh$|^tests/host/test_cpack_run_registration\.py$
      - id: spotrf-data-chain-tests
        name: Spotrf data chain Host tests
        entry: python -m pytest -q test/spotrf/data/test_verify_result.py
        language: python
        additional_dependencies: [numpy, pytest]
        pass_filenames: false
        files: ^test/spotrf/data/(gen_data|verify_result|test_verify_result)\.py$

  # OAT 合规性检查 (Open Source Audit Tool) — 远程 Python hook
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.6
    hooks:
      - id: oat-check
        pass_filenames: true
        stages: [pre-commit]
        verbose: true
