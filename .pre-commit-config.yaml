minimum_pre_commit_version: 4.0.0
exclude: ^LICENSES/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx)$
        args:
          - "--style={BasedOnStyle: Google, IndentWidth: 4, ColumnLimit: 120, BreakBeforeBraces: Allman}"
          - "--verbose"
          - "-i"
        exclude: ^build/|tests/third_party/

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix"]
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,tbe,copyin,alog",
            "--skip",
            "*.py,*.cpp,*.hpp,*.c,*.h",
          ]

  # typos 检查
  - repo: https://gitcode.com/gh_mirrors/ty/typos
    rev: v1.32.0
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: local
    hooks:
      - id: qr-ulp-host-tests
        name: QR ULP hard limit Host tests
        entry: python -m pytest -q tests/host/test_nonfinite_accuracy_verdict.py -k qr_ulp
        language: python
        additional_dependencies: [numpy, scipy, pytest]
        pass_filenames: false
        files: ^test/(cgeqrf|sgetrf|cgetrf|sgetri|cgetri_batched|cmatinv_batched)/data/verify_result\.py$|^tests/host/test_nonfinite_accuracy_verdict\.py$
      - id: cheevj-host-block-tests
        name: Cheevj Host numeric block tests
        entry: python -m pytest -q tests/host/test_cheevj_2x2_vector_host.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^src/cheevj/cheevj_host\.cpp$|^tests/host/test_cheevj_2x2_vector_host\.py$
      - id: cheevj-basis-verdict-tests
        name: Cheevj basis verdict Host tests
        entry: python -m pytest -q tests/host/test_cheevj_basis_verdict.py
        language: python
        additional_dependencies: [numpy, pytest]
        pass_filenames: false
        files: ^test/cheevj/data/verify_result\.py$|^tests/host/test_cheevj_basis_verdict\.py$
      - id: complex-qr-require-tests
        name: Complex QR shared require() diagnostics tests
        entry: python -m pytest -q tests/host/test_require_diagnostic_location.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^test/common/complex_qr/.*\.py$|^tests/host/test_require_diagnostic_location\.py$
      - id: install-deps-cmake-repository-tests
        name: install_deps.sh CMake repository setup tests
        entry: python -m pytest -q tests/host/test_cmake_repository_setup.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^install_deps\.sh$|^tests/host/test_cmake_repository_setup\.py$
      - id: uninstall-deletion-tests
        name: install.sh uninstall deletion Host tests
        entry: python -m pytest -q tests/host/test_uninstall_deletion_status.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^scripts/package/install\.sh$|^tests/host/test_uninstall_deletion_status\.py$
      - id: build-driver-contract-tests
        name: build.sh driver contract Host tests
        entry: python -m pytest -q tests/host/test_build_path_arguments.py
        language: python
        additional_dependencies: [pytest]
        pass_filenames: false
        files: ^build\.sh$|^tests/host/test_build_path_arguments\.py$

  # OAT 合规性检查 (Open Source Audit Tool) — 远程 Python hook
  - repo: https://gitcode.com/HiAgent/compliance
    rev: v1.0.6
    hooks:
      - id: oat-check
        pass_filenames: true
        stages: [pre-commit]
        verbose: true
